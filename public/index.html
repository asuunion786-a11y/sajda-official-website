<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAJDA Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav>
    <div class="brand-wrap">
      <img src="assets/logo.png" alt="SAJDA logo" width="36" height="36" style="border-radius:8px; background:#fff; padding:3px;">
      <div class="brand" style="font-size:1.1rem;">SAJDA<small>Admin Panel</small></div>
    </div>
    <div id="logout-wrap" style="display:none;">
      <button class="btn btn-outline" style="color:#EAF6EF; border-color:#EAF6EF; padding:8px 18px;" id="logout-btn">Log out</button>
    </div>
  </nav>
</header>

<div id="login-screen" class="login-box">
  <h2>Admin Login</h2>
  <div class="field">
    <label>Username</label>
    <input type="text" id="login-username" autocomplete="username">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="login-password" autocomplete="current-password">
  </div>
  <button class="btn btn-solid" id="login-btn" style="width:100%;">Log In</button>
  <p class="status-msg error" id="login-error" style="margin-top:12px;"></p>
</div>

<div id="admin-app" class="admin-wrap" style="display:none;">
  <div class="tabs">
    <button class="tab-btn active" data-tab="about">About</button>
    <button class="tab-btn" data-tab="activities">Activities</button>
    <button class="tab-btn" data-tab="programs">Programs</button>
    <button class="tab-btn" data-tab="achievements">Achievements</button>
    <button class="tab-btn" data-tab="publications">Publications</button>
    <button class="tab-btn" data-tab="contact">Contact</button>
  </div>

  <!-- ABOUT -->
  <div class="tab-panel active" id="panel-about">
    <div class="field"><label>Full Name</label><input id="about-fullName"></div>
    <div class="field"><label>Institution</label><input id="about-institution"></div>
    <div class="field"><label>Current Term</label><input id="about-term"></div>
    <div class="field"><label>Story</label><textarea id="about-story" style="min-height:180px;"></textarea></div>
    <div class="save-row">
      <button class="btn btn-solid" onclick="saveSection('about')">Save</button>
      <span class="status-msg" id="status-about"></span>
    </div>
  </div>

  <!-- ACTIVITIES -->
  <div class="tab-panel" id="panel-activities">
    <div id="activities-list"></div>
    <button class="add-btn" onclick="addEntry('activities')">+ Add activity</button>
    <div class="save-row">
      <button class="btn btn-solid" onclick="saveSection('activities')">Save</button>
      <span class="status-msg" id="status-activities"></span>
    </div>
  </div>

  <!-- PROGRAMS -->
  <div class="tab-panel" id="panel-programs">
    <div id="programs-list"></div>
    <button class="add-btn" onclick="addEntry('programs')">+ Add program</button>
    <div class="save-row">
      <button class="btn btn-solid" onclick="saveSection('programs')">Save</button>
      <span class="status-msg" id="status-programs"></span>
    </div>
  </div>

  <!-- ACHIEVEMENTS -->
  <div class="tab-panel" id="panel-achievements">
    <div id="achievements-list"></div>
    <button class="add-btn" onclick="addEntry('achievements')">+ Add achievement</button>
    <div class="save-row">
      <button class="btn btn-solid" onclick="saveSection('achievements')">Save</button>
      <span class="status-msg" id="status-achievements"></span>
    </div>
  </div>

  <!-- PUBLICATIONS -->
  <div class="tab-panel" id="panel-publications">
    <div id="publications-list"></div>
    <button class="add-btn" onclick="addEntry('publications')">+ Add publication</button>
    <div class="save-row">
      <button class="btn btn-solid" onclick="saveSection('publications')">Save</button>
      <span class="status-msg" id="status-publications"></span>
    </div>
  </div>

  <!-- CONTACT -->
  <div class="tab-panel" id="panel-contact">
    <div class="field"><label>Phone</label><input id="contact-phone"></div>
    <div class="field"><label>Email</label><input id="contact-email"></div>
    <div class="field"><label>Address</label><input id="contact-address"></div>
    <div class="save-row">
      <button class="btn btn-solid" onclick="saveSection('contact')">Save</button>
      <span class="status-msg" id="status-contact"></span>
    </div>
  </div>
</div>

<script>
let content = null;
let token = localStorage.getItem('sajda_admin_token') || '';

const fieldDefs = {
  activities: [{k:'title', label:'Title'}, {k:'description', label:'Description', area:true}],
  programs: [{k:'title', label:'Title'}, {k:'description', label:'Description', area:true}],
  achievements: [{k:'year', label:'Year'}, {k:'title', label:'Title'}, {k:'description', label:'Description', area:true}],
  publications: [{k:'title', label:'Title'}, {k:'cover', label:'Cover image URL (optional)'}, {k:'link', label:'Link (optional)'}]
};

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('sajda_admin_token');
  location.reload();
});

async function login(){
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Login failed'; return; }
    token = data.token;
    localStorage.setItem('sajda_admin_token', token);
    showApp();
  }catch(e){
    errEl.textContent = 'Could not reach the server.';
  }
}

async function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-app').style.display = 'block';
  document.getElementById('logout-wrap').style.display = 'block';
  await loadContent();
}

async function loadContent(){
  const res = await fetch('/api/content');
  content = await res.json();

  document.getElementById('about-fullName').value = content.about?.fullName || '';
  document.getElementById('about-institution').value = content.about?.institution || '';
  document.getElementById('about-term').value = content.about?.term || '';
  document.getElementById('about-story').value = content.about?.story || '';

  document.getElementById('contact-phone').value = content.contact?.phone || '';
  document.getElementById('contact-email').value = content.contact?.email || '';
  document.getElementById('contact-address').value = content.contact?.address || '';

  ['activities','programs','achievements','publications'].forEach(renderList);
}

function renderList(section){
  const container = document.getElementById(section + '-list');
  const items = content[section] || [];
  container.innerHTML = items.map((item, idx) => {
    const fields = fieldDefs[section].map(f => {
      const val = (item[f.k] || '').toString().replace(/"/g,'&quot;');

      if (section === 'publications' && f.k === 'cover'){
        const preview = item.cover
          ? `<img src="${esc(item.cover)}" alt="" style="width:70px; height:90px; object-fit:cover; border-radius:4px; border:1px solid #D3ECDD; margin-top:8px; display:block;">`
          : '';
        return `<div class="field">
          <label>${f.label}</label>
          <input data-section="${section}" data-idx="${idx}" data-key="${f.k}" value="${val}" id="cover-url-${idx}" placeholder="Or paste an image URL">
          <div style="margin-top:8px;">
            <input type="file" accept="image/*" onchange="uploadCover(this, ${idx})">
            <span class="status-msg" id="cover-status-${idx}"></span>
          </div>
          <div id="cover-preview-${idx}">${preview}</div>
        </div>`;
      }

      return f.area
        ? `<div class="field"><label>${f.label}</label><textarea data-section="${section}" data-idx="${idx}" data-key="${f.k}">${item[f.k] || ''}</textarea></div>`
        : `<div class="field"><label>${f.label}</label><input data-section="${section}" data-idx="${idx}" data-key="${f.k}" value="${val}"></div>`;
    }).join('');
    return `<div class="entry-card">
      <button class="remove-btn" onclick="removeEntry('${section}', ${idx})">Remove</button>
      ${fields}
    </div>`;
  }).join('') || '<p style="color:#75705F; margin-bottom:14px;">Nothing added yet.</p>';
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

async function uploadCover(inputEl, idx){
  const file = inputEl.files[0];
  if (!file) return;
  const statusEl = document.getElementById('cover-status-' + idx);
  statusEl.textContent = 'Uploading…';
  statusEl.classList.remove('error');

  const formData = new FormData();
  formData.append('file', file);

  try{
    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: formData
    });
    const data = await res.json();
    if (!res.ok){
      statusEl.textContent = data.error || 'Upload failed';
      statusEl.classList.add('error');
      return;
    }
    content.publications[idx].cover = data.url;
    document.getElementById('cover-url-' + idx).value = data.url;
    document.getElementById('cover-preview-' + idx).innerHTML =
      `<img src="${data.url}" alt="" style="width:70px; height:90px; object-fit:cover; border-radius:4px; border:1px solid #D3ECDD; margin-top:8px; display:block;">`;
    statusEl.textContent = 'Uploaded ✓';
    setTimeout(() => statusEl.textContent = '', 2000);
  }catch(e){
    statusEl.textContent = 'Could not reach the server.';
    statusEl.classList.add('error');
  }
}

function addEntry(section){
  content[section] = content[section] || [];
  const blank = {};
  fieldDefs[section].forEach(f => blank[f.k] = '');
  content[section].push(blank);
  renderList(section);
}

function removeEntry(section, idx){
  content[section].splice(idx, 1);
  renderList(section);
}

function collectListFromDOM(section){
  const items = content[section] || [];
  document.querySelectorAll(`[data-section="${section}"]`).forEach(el => {
    const idx = Number(el.dataset.idx);
    const key = el.dataset.key;
    if (items[idx]) items[idx][key] = el.value;
  });
  return items;
}

async function saveSection(section){
  const statusEl = document.getElementById('status-' + section);
  statusEl.textContent = 'Saving…';
  statusEl.classList.remove('error');

  let payload;
  if (section === 'about'){
    payload = {
      fullName: document.getElementById('about-fullName').value,
      institution: document.getElementById('about-institution').value,
      term: document.getElementById('about-term').value,
      story: document.getElementById('about-story').value
    };
  } else if (section === 'contact'){
    payload = {
      phone: document.getElementById('contact-phone').value,
      email: document.getElementById('contact-email').value,
      address: document.getElementById('contact-address').value
    };
  } else {
    payload = collectListFromDOM(section);
  }

  try{
    const res = await fetch('/api/content/' + section, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok){
      statusEl.textContent = data.error || 'Save failed';
      statusEl.classList.add('error');
      if (res.status === 401){ localStorage.removeItem('sajda_admin_token'); setTimeout(() => location.reload(), 1200); }
      return;
    }
    content = data.content;
    statusEl.textContent = 'Saved ✓';
    setTimeout(() => statusEl.textContent = '', 2000);
  }catch(e){
    statusEl.textContent = 'Could not reach the server.';
    statusEl.classList.add('error');
  }
}

if (token){ showApp(); }
</script>
</body>
</html>
